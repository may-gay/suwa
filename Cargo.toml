[package]
name = "suwa"
version = "0.1.0"
edition = "2024"
description = "A native Linux reader for Suwayomi"
license = "MPL-2.0"

[features]
default = []
cuda = ["dep:ort", "dep:ndarray", "dep:libloading", "dep:half"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
directories = "6"
futures = "0.3"
flate2 = "1"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "image-without-codecs", "advanced", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "avif-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream", "multipart"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "macros", "io-util", "process"] }
tokio-util = {version="0.7", features=["io"]}
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "half", "cuda", "load-dynamic", "api-24"] }
half = { version = "2", optional = true }
ndarray = { version = "0.17", optional = true }
libloading = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

